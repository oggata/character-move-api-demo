<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESA TACTICAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c14;
    --panel: #0d1220;
    --border: #1a2a44;
    --border-bright: #2a4a7a;
    --accent: #00aaff;
    --accent-dim: #0066aa;
    --hero: #ffd700;
    --hero-dim: #aa8800;
    --enemy: #ff3333;
    --enemy-dim: #881111;
    --success: #00ff88;
    --warn: #ff8800;
    --text: #c8d8f0;
    --text-dim: #4a6080;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Rajdhani', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── HEADER ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  #header .title {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: .2em;
  }

  #header .title span { color: var(--text-dim); }

  .stat-row {
    display: flex;
    gap: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: .15em;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  .stat-value.moves { color: var(--accent); }
  .stat-value.hits  { color: var(--enemy); }

  /* hit flash */
  @keyframes hitFlash {
    0%   { color: #fff; text-shadow: 0 0 20px var(--enemy); }
    100% { color: var(--enemy); text-shadow: none; }
  }
  .hit-flash { animation: hitFlash .6s ease-out; }

  /* ── FIELD ── */
  #field {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  #three-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* coordinate overlay */
  #overlay {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    pointer-events: none;
    text-align: right;
    line-height: 1.6;
  }

  #overlay .hero-coord { color: var(--hero); }
  #overlay .enemy-coord { color: var(--enemy); }

  /* hit notification */
  #hit-notify {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--mono);
    font-size: 28px;
    color: var(--enemy);
    letter-spacing: .2em;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 0 30px var(--enemy);
    z-index: 20;
  }

  @keyframes notifyAnim {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(1.3); }
    70%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-60%); }
  }

  .notify-show { animation: notifyAnim 1.2s ease-out forwards; }

  /* ── COMMAND PANEL ── */
  #command {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px 16px;
  }

  .cmd-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .2em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .cmd-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 10px;
  }

  #api-url {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 0 12px;
    color: var(--accent);
    height: 38px;
    outline: none;
    transition: border-color .2s;
  }

  #api-url:focus { border-color: var(--accent); }

  #btn-move {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .1em;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: #fff;
    padding: 0 22px;
    height: 38px;
    cursor: pointer;
    transition: background .15s, transform .1s;
    white-space: nowrap;
  }

  #btn-move:hover { background: var(--accent); }
  #btn-move:active { transform: scale(.97); }
  #btn-move:disabled { opacity: .4; cursor: not-allowed; }

  #btn-reset {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    background: transparent;
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text-dim);
    padding: 0 14px;
    height: 38px;
    cursor: pointer;
    transition: border-color .2s, color .2s;
    white-space: nowrap;
  }

  #btn-reset:hover { border-color: var(--text); color: var(--text); }

  .log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 18px;
  }

  .log-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .3s;
  }

  #log {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  /* scanline effect on field */
  #field::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,.06) 3px,
      rgba(0,0,0,.06) 4px
    );
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<!-- HEADER / STATS -->
<div id="header">
  <div class="title">Game Demo <span>//</span> v1.0</div>
  <div class="stat-row">
    <div class="stat">
      <div class="stat-label">MOVES</div>
      <div class="stat-value moves" id="stat-moves">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">HITS</div>
      <div class="stat-value hits" id="stat-hits">0</div>
    </div>
  </div>
</div>

<!-- THREE.JS FIELD -->
<div id="field">
  <canvas id="three-canvas"></canvas>
  <div id="overlay">
    <div class="hero-coord" id="hero-coord">■ HERO  [5, 5]</div>
    <div class="enemy-coord" id="enemy-coord">■ ENEMY [2, 7]</div>
  </div>
  <div id="hit-notify">⚡ HIT!</div>
</div>

<!-- COMMAND PANEL -->
<div id="command">
  <div class="cmd-label">// API ENDPOINT</div>
  <div class="cmd-row">
    <input id="api-url" type="text" value="http://localhost:3000/move" spellcheck="false" />
    <button id="btn-move" onclick="doMove()">▶ MOVE</button>
    <button id="btn-reset" onclick="doReset()">RESET</button>
  </div>
  <div class="log-row">
    <div class="log-dot" id="log-dot"></div>
    <div id="log">ready — press MOVE to begin</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const GRID = 10;
let hero  = { x: 5, z: 5 };
let enemy = { x: 2, z: 7 };
let moveCount = 0;
let hitCount  = 0;
let busy = false;

// ─── THREE.JS SETUP ──────────────────────────────────────────────────────────
const canvas   = document.getElementById('three-canvas');
const field    = document.getElementById('field');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c14);
scene.fog = new THREE.FogExp2(0x080c14, 0.045);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(4.5, 14, 19);
camera.lookAt(4.5, 0, 4.5);

function resize() {
  const w = field.clientWidth, h = field.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ─── LIGHTING ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x223355, 1.8));

const sun = new THREE.DirectionalLight(0x6699cc, 1.6);
sun.position.set(6, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 50;
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
scene.add(sun);

const heroLight  = new THREE.PointLight(0xffcc00, 1.2, 5);
const enemyLight = new THREE.PointLight(0xff2200, 1.2, 5);
scene.add(heroLight);
scene.add(enemyLight);

// ─── GRID FLOOR ──────────────────────────────────────────────────────────────
// Floor plane
const floorGeo = new THREE.PlaneGeometry(GRID, GRID);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x0b1220, roughness: 0.9, metalness: 0.05
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(GRID / 2, -0.01, GRID / 2);
floor.receiveShadow = true;
scene.add(floor);

// Grid lines
const lineMat = new THREE.LineBasicMaterial({ color: 0x1a2d4a });
for (let i = 0; i <= GRID; i++) {
  const g1 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(i, 0, 0), new THREE.Vector3(i, 0, GRID)
  ]);
  const g2 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, i), new THREE.Vector3(GRID, 0, i)
  ]);
  scene.add(new THREE.Line(g1, lineMat));
  scene.add(new THREE.Line(g2, lineMat));
}

// Cell tiles (subtle)
for (let x = 0; x < GRID; x++) {
  for (let z = 0; z < GRID; z++) {
    const tileGeo = new THREE.PlaneGeometry(0.94, 0.94);
    const col = (x + z) % 2 === 0 ? 0x0c1428 : 0x0e1830;
    const tileMat = new THREE.MeshStandardMaterial({ color: col, roughness: 1 });
    const tile = new THREE.Mesh(tileGeo, tileMat);
    tile.rotation.x = -Math.PI / 2;
    tile.position.set(x + 0.5, 0, z + 0.5);
    tile.receiveShadow = true;
    scene.add(tile);
  }
}

// Corner markers
const cornerMat = new THREE.MeshStandardMaterial({ color: 0x1a3060, roughness: .6 });
[[0,0],[GRID,0],[0,GRID],[GRID,GRID]].forEach(([x,z]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(.2,.4,.2), cornerMat);
  m.position.set(x, .2, z);
  scene.add(m);
});

// ─── CHARACTER MESHES ─────────────────────────────────────────────────────────
function makeCharacter(color, emissive) {
  const group = new THREE.Group();

  // Base platform
  const baseGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.08, 8);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x111828, roughness: .8 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.04;
  base.receiveShadow = true;
  group.add(base);

  // Main cube body
  const cubeGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
  const cubeMat = new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.4
  });
  const cube = new THREE.Mesh(cubeGeo, cubeMat);
  cube.position.y = 0.4;
  cube.castShadow = true;
  group.add(cube);

  // Top pip
  const pipGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
  const pip = new THREE.Mesh(pipGeo, new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity: 0.9, roughness: .2, metalness: .6
  }));
  pip.position.y = 0.82;
  group.add(pip);

  return { group, cube, pip };
}

const heroChar  = makeCharacter(0xffcc00, 0xffaa00);
const enemyChar = makeCharacter(0xff2222, 0xcc1100);
scene.add(heroChar.group);
scene.add(enemyChar.group);

function placeAt(char, gx, gz) {
  char.group.position.set(gx + 0.5, 0, gz + 0.5);
}
placeAt(heroChar,  hero.x,  hero.z);
placeAt(enemyChar, enemy.x, enemy.z);

// Sync point lights
function syncLights() {
  heroLight.position.set(hero.x + .5, 2, hero.z + .5);
  enemyLight.position.set(enemy.x + .5, 2, enemy.z + .5);
}
syncLights();

// ─── ANIMATION STATE ──────────────────────────────────────────────────────────
let heroAnim  = null; // { from, to, t }
let enemyAnim = null;

function startAnim(from, to, onDone) {
  return { from: {...from}, to: {...to}, t: 0, onDone };
}

function lerpNum(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; }

// ─── RENDER LOOP ──────────────────────────────────────────────────────────────
let lastTime = 0;
const ANIM_DURATION = 0.35; // seconds

function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  // Hero animation
  if (heroAnim) {
    heroAnim.t = Math.min(heroAnim.t + dt / ANIM_DURATION, 1);
    const e = easeInOut(heroAnim.t);
    const x = lerpNum(heroAnim.from.x, heroAnim.to.x, e);
    const z = lerpNum(heroAnim.from.z, heroAnim.to.z, e);
    const bounce = Math.sin(heroAnim.t * Math.PI) * 0.4;
    heroChar.group.position.set(x + .5, bounce, z + .5);
    heroChar.cube.rotation.y = heroAnim.t * Math.PI * 2;
    if (heroAnim.t >= 1) {
      heroChar.group.position.set(heroAnim.to.x + .5, 0, heroAnim.to.z + .5);
      heroChar.cube.rotation.y = 0;
      const cb = heroAnim.onDone;
      heroAnim = null;
      if (cb) cb();
    }
  }

  // Enemy animation
  if (enemyAnim) {
    enemyAnim.t = Math.min(enemyAnim.t + dt / ANIM_DURATION, 1);
    const e = easeInOut(enemyAnim.t);
    const x = lerpNum(enemyAnim.from.x, enemyAnim.to.x, e);
    const z = lerpNum(enemyAnim.from.z, enemyAnim.to.z, e);
    const bounce = Math.sin(enemyAnim.t * Math.PI) * 0.35;
    enemyChar.group.position.set(x + .5, bounce, z + .5);
    enemyChar.cube.rotation.y = -enemyAnim.t * Math.PI * 2;
    if (enemyAnim.t >= 1) {
      enemyChar.group.position.set(enemyAnim.to.x + .5, 0, enemyAnim.to.z + .5);
      enemyChar.cube.rotation.y = 0;
      enemyAnim = null;
    }
  }

  // Idle bob for hero pip
  heroChar.pip.position.y = 0.82 + Math.sin(time * .002) * 0.06;
  enemyChar.pip.position.y = 0.82 + Math.sin(time * .0025 + 1) * 0.06;

  // Sync lights
  heroLight.position.set(heroChar.group.position.x, 2, heroChar.group.position.z);
  enemyLight.position.set(enemyChar.group.position.x, 2, enemyChar.group.position.z);

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function randomStep(pos) {
  const dirs = [{dx:1,dz:0},{dx:-1,dz:0},{dx:0,dz:1},{dx:0,dz:-1}];
  const valid = dirs.filter(d =>
    pos.x + d.dx >= 0 && pos.x + d.dx < GRID &&
    pos.z + d.dz >= 0 && pos.z + d.dz < GRID
  );
  const d = valid[Math.floor(Math.random() * valid.length)];
  return { x: pos.x + d.dx, z: pos.z + d.dz };
}

function updateCoords() {
  document.getElementById('hero-coord').textContent =
    `■ HERO  [${hero.x}, ${hero.z}]`;
  document.getElementById('enemy-coord').textContent =
    `■ ENEMY [${enemy.x}, ${enemy.z}]`;
}

function updateStats() {
  document.getElementById('stat-moves').textContent = moveCount;
  document.getElementById('stat-hits').textContent  = hitCount;
}

function setLog(msg, active) {
  document.getElementById('log').textContent = msg;
  const dot = document.getElementById('log-dot');
  dot.style.opacity = active ? '1' : '0';
  dot.style.background = active ? 'var(--accent)' : 'var(--accent)';
}

function showHit() {
  const el = document.getElementById('hit-notify');
  el.classList.remove('notify-show');
  void el.offsetWidth; // reflow
  el.classList.add('notify-show');

  // Flash hits counter
  const hel = document.getElementById('stat-hits');
  hel.classList.remove('hit-flash');
  void hel.offsetWidth;
  hel.classList.add('hit-flash');
}

function checkHit() {
  if (hero.x === enemy.x && hero.z === enemy.z) {
    hitCount++;
    updateStats();
    showHit();
    setLog(`💥 HIT! total hits: ${hitCount}`, false);
    return true;
  }
  return false;
}

function isLocalhost(url) {
  try {
    const u = new URL(url);
    return u.hostname === 'localhost' || u.hostname === '127.0.0.1';
  } catch { return false; }
}

// ─── MOCK API ─────────────────────────────────────────────────────────────────
function mockApi(currentX, currentZ) {
  const next = randomStep({ x: currentX, z: currentZ });
  return Promise.resolve({ x: next.x, y: next.z }); // API returns x,y (y=row=z)
}

// ─── MAIN ACTION ─────────────────────────────────────────────────────────────
async function doMove() {
  if (busy) return;
  busy = true;
  document.getElementById('btn-move').disabled = true;
  setLog('fetching…', true);

  try {
    let newPos;
    const url = document.getElementById('api-url').value.trim();

    if (isLocalhost(url)) {
      // Mock
      await new Promise(r => setTimeout(r, 120)); // tiny delay for realism
      const data = await mockApi(hero.x, hero.z);
      newPos = { x: clamp(data.x, 0, GRID-1), z: clamp(data.y, 0, GRID-1) };
      setLog(`mock → HERO moves to [${newPos.x}, ${newPos.z}]`, false);
    } else {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.x == null || data.y == null) throw new Error('invalid JSON — need {x, y}');
      newPos = { x: clamp(Math.round(data.x), 0, GRID-1), z: clamp(Math.round(data.y), 0, GRID-1) };
      setLog(`api → HERO moves to [${newPos.x}, ${newPos.z}]`, false);
    }

    // Animate hero
    const prevHero = {...hero};
    heroAnim = startAnim(prevHero, newPos, null);
    hero = newPos;

    // Animate enemy (random)
    const prevEnemy = {...enemy};
    const newEnemy = randomStep(enemy);
    enemyAnim = startAnim(prevEnemy, newEnemy, null);
    enemy = newEnemy;

    moveCount++;
    updateStats();
    updateCoords();

    // Check hit after anim settles
    setTimeout(() => {
      checkHit();
      busy = false;
      document.getElementById('btn-move').disabled = false;
    }, ANIM_DURATION * 1000 + 50);

  } catch (err) {
    setLog(`error: ${err.message}`, false);
    busy = false;
    document.getElementById('btn-move').disabled = false;
  }
}

function doReset() {
  if (busy) return;
  hero  = { x: 5, z: 5 };
  enemy = { x: 2, z: 7 };
  heroAnim  = null;
  enemyAnim = null;
  placeAt(heroChar,  hero.x,  hero.z);
  placeAt(enemyChar, enemy.x, enemy.z);
  moveCount = 0;
  hitCount  = 0;
  updateStats();
  updateCoords();
  setLog('reset — press MOVE to begin', false);
}

// ─── KEYBOARD SHORTCUT ────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    doMove();
  }
});

// init
updateCoords();
updateStats();
</script>
</body>
</html>
